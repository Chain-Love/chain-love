name: Validate JSON tools

on:
  pull_request:
    branches:
      - json-tools
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: validate-json-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    name: Generate JSON and validate (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout proposed tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout listing data from main
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: main-data
          persist-credentials: false
          sparse-checkout: |
            listings
            references

      - name: Prepare isolated validation workspace
        run: |
          echo "Tools revision: $(git rev-parse HEAD)"
          echo "Data revision: $(git -C main-data rev-parse HEAD)"
          mkdir validation-work
          cp -r main-data/listings main-data/references meta validation-work/
          cp tools/csv_to_json.py tools/validate_csv.py tools/validate.py tools/schema.json validation-work/
          cp tools/test_provider_identity.py validation-work/

      - name: Test, generate and validate without network access
        run: |
          docker run --rm \
            --network=none \
            -v "${{ github.workspace }}/validation-work:/workspace" \
            -v "${{ github.workspace }}/tools/wheels:/wheels:ro" \
            -v "${{ github.workspace }}/tools/requirements.txt:/requirements.txt:ro" \
            -w /workspace \
            python:3.12-slim \
            /bin/bash -euc '
              pip install --no-index --find-links=/wheels -r /requirements.txt
              python3 -m unittest -v test_provider_identity
              python3 validate_csv.py
              python3 csv_to_json.py
              python3 validate.py
            '

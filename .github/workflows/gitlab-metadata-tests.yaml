name: GitLab metadata tests
on:
  pull_request:
    branches: [json-tools]
  push:
    branches: [fix/gitlab-metadata-error-responses]
permissions:
  contents: read
jobs:
  test:
    name: GitLab metadata regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links=tools/wheels -r tools/requirements.txt
      - run: python -m unittest discover -s tools -p test_gitlab_metadata.py -v

name: Link Check (tests)

on:
  pull_request:
    paths:
      - '.github/scripts/link-check-*'
      - '.github/tests/**'
      - '.github/workflows/link-check-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test archive validation and rendering
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Test source and publication guards
        run: node --test .github/tests/link-check-report.test.cjs

name: Link Check (report)

on:
  workflow_run:
    workflows: ["Link Check (analysis)"]
    types: [completed]

permissions: {}

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    steps:
      # Only load scripts from the report workflow's trusted default-branch commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Validate source, artifact and destination; publish report
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { publish } = require('./.github/scripts/link-check-report.cjs');
            await publish({ github, context, core });

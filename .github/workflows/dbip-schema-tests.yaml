name: DBIP schema compatibility
on:
  pull_request:
    branches: [json-tools]
  push:
    branches: [fix/five-approved-dbip-schema]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: DBIP schema compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-index --find-links=tools/wheels -r tools/requirements.txt
      - run: python -m unittest discover -s tools -p 'test_schema_versions.py' -v

name: "Validate JSON"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  link-analysis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate fixtures and workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test real inline link analyzer with local Git fixtures
        run: python -B -m unittest discover -s tools/tests -p test_link_analysis.py -v

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout data for tooling validation
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: validation-data
          persist-credentials: false

      - name: Prepare candidate scripts and metadata
        run: |
          cp tools/csv_to_json.py tools/validate.py tools/schema.json tools/validate_csv.py validation-data/
          mkdir -p validation-data/meta
          cp -r meta/. validation-data/meta/

      - name: Run validation without network access
        run: |
          docker run --rm \
            --network=none \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace/validation-data \
            python:3.12-slim \
            /bin/bash -c "
              pip install --no-index --find-links=/workspace/tools/wheels -r /workspace/tools/requirements.txt &&
              python3 -B -m unittest discover -s /workspace/tools/tests -p test_provider_lifecycle.py -v &&
              python3 validate_csv.py &&
              python3 csv_to_json.py &&
              python3 validate.py
            "

name: "Validate JSON"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    name: Generate JSON and validate (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout this PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run SDK metadata regression tests without network
        run: |
          docker run --rm \
            --network=none \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.12-slim \
            /bin/bash -c "
              pip install --no-index --find-links=tools/wheels -r tools/requirements.txt &&
              python3 -B -m unittest discover -s tests -p 'test_sdk_build_metadata.py' -v
            "

name: "Validate JSON"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: validate-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Assemble the workspace from THIS checkout only. Nothing is borrowed from
      # the json-tools base branch: doing so previously meant this PR's own
      # csv_to_json.py, schema.json and meta/columns.json were copied over and
      # never executed, so a green run proved nothing about the change.
      # meta/ already lives at the repo root on this branch, so it is used in
      # place rather than copied.
      - name: Assemble workspace from this PR files
        run: |
          set -euo pipefail
          cp tools/csv_to_json.py tools/validate.py tools/validate_csv.py .
          cp tools/schema.json .
          mkdir -p listings/specific-networks/demo-network listings/all-networks \
                   references/offers references/providers
          cp tools/tests/fixtures/runtime-requirements/listings.sdks.csv \
             listings/specific-networks/demo-network/sdks.csv
          cp tools/tests/fixtures/runtime-requirements/offers.sdks.csv \
             references/offers/sdks.csv
          cp tools/tests/fixtures/runtime-requirements/providers.csv \
             references/providers/providers.csv
          ls -l

      # The whole check runs from a script file so that the shell quoting is
      # readable and the stages are greppable in the job log.
      - name: Validate with this PR tool, schema and metadata
        run: |
          cat > /tmp/check.sh <<'SCRIPT'
          set -e
          pip install --no-index --find-links=tools/wheels -r tools/requirements.txt

          FIX=tools/tests/fixtures/runtime-requirements
          OFFERS=references/offers/sdks.csv

          echo "==> regression test: tools/tests/test_runtime_requirements.py"
          python3 tools/tests/test_runtime_requirements.py

          echo "==> structural CSV validation"
          python3 validate_csv.py

          echo "==> csv -> json (runs validate_runtime_requirements over the fixture rows)"
          rm -rf json
          python3 csv_to_json.py

          echo "==> the fixture value must survive offer resolution"
          python3 - <<'PY'
          import json
          data = json.load(open("json/demo-network.json"))
          rows = [r for r in data["sdks"] if r["slug"] == "algokit-utils-py"]
          assert len(rows) == 1, rows
          value = rows[0].get("runtimeRequirements")
          assert isinstance(value, dict) and set(value) == {"python", "node"}, value
          print("runtimeRequirements arrived from references/offers:", sorted(value))
          PY

          echo "==> json vs this PR schema.json + meta/columns.json + meta/categories.json"
          test -d json
          python3 validate.py

          echo "==> negative controls: each invalid value must be rejected, for its own rule"
          check_rejected() {
            fixture="$1"
            expected="$2"
            cp "$fixture" "$OFFERS"
            rm -rf json
            if python3 csv_to_json.py > /tmp/negative.log 2>&1; then
              echo "ERROR: $(basename "$fixture") was accepted - the rule is not enforced"
              cat /tmp/negative.log
              exit 1
            fi
            hits=$(grep -c "$expected" /tmp/negative.log || true)
            if [ "$hits" = "0" ]; then
              echo "ERROR: $(basename "$fixture") was rejected, but not by this rule (no '$expected' in the log)"
              cat /tmp/negative.log
              exit 1
            fi
            echo "OK: $(basename "$fixture") rejected [$expected]"
          }
          check_rejected "$FIX/offers.sdks.negative-empty-object.csv" "must not be an empty object"
          check_rejected "$FIX/offers.sdks.negative-bad-syntax.csv" "syntax must be one of"
          check_rejected "$FIX/offers.sdks.negative-unknown-key.csv" "unknown runtime key"
          check_rejected "$FIX/offers.sdks.negative-missing-source.csv" "source must be a non-empty string"
          check_rejected "$FIX/offers.sdks.negative-bad-source.csv" "must be an absolute http(s) URL with a host"
          # The next one carries the scheme but no host: an implementation that only checks
          # the prefix would accept "https:///pyproject.toml", so these two pin different halves.
          check_rejected "$FIX/offers.sdks.negative-source-no-host.csv" "must be an absolute http(s) URL with a host"
          # This row is referenced by no listing, so only the canonical-offers call site can
          # see it. Before that call site existed this file was accepted outright.
          check_rejected "$FIX/offers.sdks.negative-unreferenced-empty.csv" "must not be an empty object"
          cp "$FIX/offers.sdks.csv" "$OFFERS"

          # The mutations below are the point of this job: each removes exactly one of this
          # PR substantive changes and asserts the check goes red, or flips outcome. A check
          # that cannot fail does not cover the change it claims to cover.
          #
          # unwire <variable> <expected-count> rewrites an "if <var>:" guard as
          # "if False and <var>:" and fails when the hit count is not the expected one, so a
          # renamed variable cannot quietly turn a mutation into a no-op.
          cat > /tmp/unwire.py <<'PY'
          import re
          import sys

          var, expected = sys.argv[1], int(sys.argv[2])
          src = open("csv_to_json.py", encoding="utf-8").read()
          src, n = re.subn(r"^(\s*)if %s:$" % re.escape(var), r"\1if False and %s:" % var, src, flags=re.M)
          if n != expected:
              sys.exit(f"FATAL: unwire {var} matched {n} time(s), expected {expected}")
          open("csv_to_json.py", "w", encoding="utf-8").write(src)
          print(f"unwired {var} at {n} call site(s)")
          PY

          echo "==> mutation 1: drop the declaration from schema.json -> validate.py must fail"
          cp schema.json /tmp/schema.bak
          python3 - <<'PY'
          import json
          schema = json.load(open("schema.json"))
          del schema["$defs"]["sdks"]["properties"]["runtimeRequirements"]
          json.dump(schema, open("schema.json", "w"), ensure_ascii=False)
          PY
          rm -rf json
          python3 csv_to_json.py
          if python3 validate.py > /tmp/m1.log 2>&1; then
            echo "ERROR: validate.py passed without the runtimeRequirements declaration - the check does not read this PR schema.json"
            exit 1
          fi
          grep -q "runtimeRequirements" /tmp/m1.log
          cp /tmp/schema.bak schema.json
          echo "OK: schema.json is exercised by this check"

          echo "==> mutation 2: drop the entry from meta/columns.json -> validate.py must fail"
          cp meta/columns.json /tmp/columns.bak
          python3 - <<'PY'
          import json
          columns = json.load(open("meta/columns.json"))
          del columns["runtimeRequirements"]
          json.dump(columns, open("meta/columns.json", "w"), ensure_ascii=False)
          PY
          rm -rf json
          python3 csv_to_json.py
          if python3 validate.py > /tmp/m2.log 2>&1; then
            echo "ERROR: validate.py passed without the meta/columns.json entry - the check does not read this PR meta/columns.json"
            exit 1
          fi
          grep -q "missing in meta.columns" /tmp/m2.log
          cp /tmp/columns.bak meta/columns.json
          echo "OK: meta/columns.json is exercised by this check"

          echo "==> mutation 3: disconnect every validate_runtime_requirements call site -> the negative fixture must be accepted"
          cp csv_to_json.py /tmp/csv_to_json.bak
          python3 /tmp/unwire.py runtime_req_errors 1
          python3 /tmp/unwire.py offer_runtime_req_errors 1
          cp "$FIX/offers.sdks.negative-empty-object.csv" "$OFFERS"
          rm -rf json
          if python3 csv_to_json.py > /tmp/m3.log 2>&1; then
            echo "OK: with both call sites disconnected the empty object is accepted, so the negative controls come from this PR validator"
          else
            echo "ERROR: the empty object is still rejected with the validator disconnected - the negative controls are not testing this PR code"
            cat /tmp/m3.log
            exit 1
          fi
          cp /tmp/csv_to_json.bak csv_to_json.py
          cp "$FIX/offers.sdks.csv" "$OFFERS"

          # Mutation 3 can no longer tell the two call sites apart, because it removes both.
          # This one removes only the canonical-offers call site and asserts both halves: the
          # unreferenced row (which no network pass can see) flips to accepted, while the
          # referenced row keeps being rejected by the network call site. Without that second
          # assertion an "everything is off" regression would look identical.
          echo "==> mutation 4: disconnect only the canonical-offers call site"
          cp csv_to_json.py /tmp/csv_to_json.bak
          python3 /tmp/unwire.py offer_runtime_req_errors 1
          cp "$FIX/offers.sdks.negative-unreferenced-empty.csv" "$OFFERS"
          rm -rf json
          if python3 csv_to_json.py > /tmp/m4a.log 2>&1; then
            echo "OK: offers.sdks.negative-unreferenced-empty.csv -> accepted (no network pass ever sees this row)"
          else
            echo "ERROR: the unreferenced row is still rejected with the canonical call site disconnected - something else reaches it"
            cat /tmp/m4a.log
            exit 1
          fi
          cp "$FIX/offers.sdks.negative-empty-object.csv" "$OFFERS"
          rm -rf json
          if python3 csv_to_json.py > /tmp/m4b.log 2>&1; then
            echo "ERROR: the referenced row was accepted too - the mutation disabled more than the canonical call site"
            exit 1
          fi
          grep -q "must not be an empty object" /tmp/m4b.log
          echo "OK: offers.sdks.negative-empty-object.csv -> still rejected by the network call site"
          cp /tmp/csv_to_json.bak csv_to_json.py
          cp "$FIX/offers.sdks.csv" "$OFFERS"

          # The schema pattern is redundant while csv_to_json.py runs first, so no fixture can
          # show whether it is live. Drive validate.py directly on a mutated generated json:
          # with the pattern the value must be rejected, without it the same value must pass.
          # That is what proves the pattern -- and not some other rule -- does the work.
          echo "==> mutation 5: drop the source pattern from schema.json -> validate.py must stop rejecting a non-URL source"
          cp schema.json /tmp/schema.bak
          rm -rf json
          python3 csv_to_json.py
          python3 - <<'PY'
          import json
          path = "json/demo-network.json"
          data = json.load(open(path))
          hits = 0
          for row in data["sdks"]:
              value = row.get("runtimeRequirements")
              if isinstance(value, dict) and "python" in value:
                  value["python"]["source"] = "not-a-url"
                  hits += 1
          assert hits == 1, f"expected 1 row to rewrite, found {hits}"
          json.dump(data, open(path, "w"), ensure_ascii=False)
          print(f"rewrote {hits} source value in the generated json")
          PY
          if python3 validate.py > /tmp/m5a.log 2>&1; then
            echo "ERROR: validate.py accepted a non-URL source - the schema pattern does not do anything"
            exit 1
          fi
          grep -q "does not match" /tmp/m5a.log
          python3 - <<'PY'
          import json
          schema = json.load(open("schema.json"))
          for rt in ("python", "node"):
              del schema["$defs"]["sdks"]["properties"]["runtimeRequirements"]["properties"][rt]["properties"]["source"]["pattern"]
          json.dump(schema, open("schema.json", "w"), ensure_ascii=False)
          PY
          if python3 validate.py > /tmp/m5b.log 2>&1; then
            echo "OK: with the pattern removed the same non-URL source passes, so the pattern is what rejected it"
          else
            echo "ERROR: validate.py still rejected the non-URL source without the pattern - some other rule is responsible"
            tail -8 /tmp/m5b.log
            exit 1
          fi
          cp /tmp/schema.bak schema.json
          rm -rf json

          echo
          echo "All stages passed. Every check above was shown to fail when this PR implementation regresses."
          SCRIPT
          docker run --rm --network=none \
            -v "${{ github.workspace }}:/workspace" \
            -v /tmp/check.sh:/check.sh:ro \
            -w /workspace \
            python:3.12-slim /bin/bash /check.sh

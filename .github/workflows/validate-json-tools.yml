name: Validate JSON tools
on:
  pull_request:
    branches: [json-tools]
  push:
    branches: [fix/ndjson-explicit-utf8-issue4020-20261024]
permissions:
  contents: read
jobs:
  generate-and-validate:
    name: Generate JSON and validate (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools.test_create_ndjson_utf8 -v
